clusterID: ""
organization: ""

global:
  # All Apps will be installed in this namespace unless overridden below.
  namespace: "security-bundle"

# User values can be provided via a ConfigMap or Secret for each individual app
# using the structure shown below.

userConfig:
  jiralert:
    configMap:
      values:
        global:
          podSecurityStandards:
            enforced: true
  kyvernoPolicies:
    configMap:
      values:
        kyverno-policies:
          policyType: ValidatingPolicy
          podSecurityStandard: restricted
          includeOtherPolicies:
            - require-non-root-groups
          validationFailureAction: Enforce
        bestPracticesPolicies:
          policies:
            check-resources-request-and-limits-ratio:
              enabled: true
              mode: Enforce
            disallow-latest-tag:
              enabled: true
              mode: Enforce
            prevent-bare-pods:
              enabled: true
              mode: Enforce
            require-container-requests-and-limits:
              enabled: true
              mode: Enforce
            require-emptydir-requests-and-limits:
              enabled: true
              mode: Enforce
            require-pod-probes:
              enabled: true
              mode: Enforce
        supplementalSecurityPolicies:
          policies:
            audit-event-on-exec:
              enabled: true
              policyType: GeneratingPolicy
            add-default-deny-network-policy:
              enabled: true
              policyType: GeneratingPolicy
            check-serviceaccount-secrets:
              enabled: true
              mode: Enforce
            disallow-gitrepo-volume:
              enabled: true
              mode: Enforce
            require-ro-rootfs:
              enabled: true
              mode: Enforce
            restrict-binding-clusteradmin:
              enabled: true
              mode: Enforce
            restrict-binding-system-groups:
              enabled: true
              mode: Enforce
            restrict-external-ips:
              enabled: true
              mode: Enforce
            restrict-sa-automount-sa-token:
              enabled: true
              mode: Enforce
        debugAccessPolicies:
          policies:
            disallow-ephemeral-containers:
              enabled: true
              mode: Enforce
            disallow-unapproved-debug-access:
              enabled: true
              mode: Enforce
            block-expired-exceptions:
              enabled: true
              mode: Enforce
            purge-expired-exceptions:
              enabled: true
              policyType: DeletingPolicy
  kyvernoPolicyOperator:
    configMap:
      values:
        crds:
          install: true

apps:
  cloudnativePG:
    appName: cloudnative-pg
    chartName: cloudnative-pg
    catalog: giantswarm-operations-platform
    dependsOn:
      cilium: true
      prometheus-operator-crd: true
    createNamespace: true
    enabled: false
    namespace: giantswarm
    # used by renovate
    # repo: giantswarm/cloudnative-pg-app
    version: 0.1.0

  exceptionRecommender:
    appName: exception-recommender
    chartName: exception-recommender
    catalog: giantswarm
    dependsOn:
      kyverno-crds: true
    createNamespace: true
    enabled: false
    # namespace: security-bundle
    # used by renovate
    # repo: giantswarm/exception-recommender
    version: 0.3.0

  falco:
    appName: falco
    chartName: falco
    catalog: giantswarm
    dependsOn:
      cilium: true
      kyverno-crds: true
    createNamespace: true
    enabled: false
    # namespace: security-bundle
    # used by renovate
    # repo: giantswarm/falco-app
    version: 0.14.1

  jiralert:
    appName: jiralert
    chartName: jiralert
    catalog: giantswarm
    createNamespace: true
    enabled: false
    # namespace: security-bundle
    # used by renovate
    # repo: giantswarm/jiralert-app
    version: 0.1.4

  kubescape:
    appName: kubescape
    chartName: kubescape
    catalog: giantswarm
    dependsOn:
      cilium: true
      kyverno-crds: true
      kyverno-policy-operator: true
    createNamespace: true
    enabled: false
    namespace: kubescape
    # kubescape does not finish installing within Flux's 5m default, so it
    # needs the same kind of override kyverno has.
    options:
      install:
        timeout: 15m
      upgrade:
        timeout: 15m
    # used by renovate
    # repo: giantswarm/kubescape-app
    version: 0.1.2

  kyverno:
    appName: kyverno
    chartName: kyverno
    catalog: giantswarm
    dependsOn:
      cilium: true
      kyverno-crds: true
      prometheus-operator-crd: true
      alloy-podlogs-crds: true
    enabled: true
    namespace: kyverno
    createNamespace: true
    # Options allow to configure timeouts:
    # https://docs.giantswarm.io/getting-started/app-platform/installation-configuration/
    options:
      install:
        timeout: 15m
      upgrade:
        timeout: 15m
    # used by renovate
    # repo: giantswarm/kyverno-app
    version: 0.26.1

  kyvernoCrds:
    appName: kyverno-crds
    chartName: kyverno-crds
    catalog: giantswarm
    enabled: true
    namespace: kyverno
    createNamespace: true
    # used by renovate
    # repo: giantswarm/kyverno-crds
    version: 1.19.2

  kyvernoPolicyOperator:
    appName: kyverno-policy-operator
    chartName: kyverno-policy-operator
    catalog: giantswarm
    dependsOn:
      cilium: true
      kyverno-crds: true
      kyverno: true
      alloy-podlogs-crds: true
    enabled: true
    createNamespace: true
    # namespace: security-bundle
    # used by renovate
    # repo: giantswarm/kyverno-policy-operator
    version: 0.2.3

  # Kyverno policies for Kubernetes Pod Security Standards (PSS).
  # From: https://github.com/giantswarm/kyverno-policies/
  kyvernoPolicies:
    appName: kyverno-policies
    chartName: kyverno-policies
    catalog: giantswarm-test
    dependsOn:
      kyverno-crds: true
    enabled: true
    namespace: kyverno
    createNamespace: true
    # used by renovate
    # repo: giantswarm/kyverno-policies
    version: 0.28.20-r528bde93t20261112142836h74fc01c

  policyApiCrds:
    appName: policy-api-crds
    chartName: policy-api-crds
    catalog: giantswarm
    dependsOn:
      kyverno-policy-operator: true
    createNamespace: true
    enabled: false
    namespace: policy-system
    # used by renovate
    # repo: giantswarm/policy-api
    version: 0.1.18

  reportsServer:
    appName: reports-server
    chartName: reports-server
    catalog: giantswarm-operations-platform
    dependsOn:
      cloudnative-pg: true
    createNamespace: true
    enabled: false
    namespace: kyverno
    # used by renovate
    # repo: giantswarm/reports-server-app
    version: 0.1.3

  starboardExporter:
    appName: starboard-exporter
    chartName: starboard-exporter
    catalog: giantswarm
    dependsOn:
      prometheus-operator-crd: true
    createNamespace: true
    enabled: false
    namespace: security-bundle
    # used by renovate
    # repo: giantswarm/starboard-exporter
    version: 1.2.44

  trivy:
    appName: trivy
    chartName: trivy
    catalog: giantswarm
    dependsOn:
      kyverno-crds: true
    createNamespace: true
    enabled: false
    # namespace: security-bundle
    # used by renovate
    # repo: giantswarm/trivy-app
    version: 0.18.1

  trivyOperator:
    appName: trivy-operator
    chartName: trivy-operator
    catalog: giantswarm
    dependsOn:
      cilium: true
      kyverno-crds: true
      trivy: true
    createNamespace: true
    enabled: false
    # namespace: security-bundle
    # used by renovate
    # repo: giantswarm/trivy-operator-app
    version: 0.15.0
