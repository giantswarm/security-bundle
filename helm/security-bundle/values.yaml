clusterID: ""
organization: ""
global:
  # All Apps will be installed in this namespace unless overridden below.
  namespace: "security-bundle"
# User values can be provided via a ConfigMap or Secret for each individual app
# using the structure shown below.
userConfig:
  jiralert:
    configMap:
      values:
        global:
          podSecurityStandards:
            enforced: true
  kyvernoPolicies:
    configMap:
      values:
        kyverno-policies:
          validationFailureAction: Enforce
  kyvernoPolicyOperator:
    configMap:
      values:
        crds:
          install: true
apps:
  cloudnativePG:
    appName: cloudnative-pg
    chartName: cloudnative-pg
    catalog: giantswarm-operations-platform
    dependsOn:
      - cilium
      - prometheus-operator-crd
    createNamespace: true
    enabled: false
    namespace: giantswarm
    # used by renovate
    # repo: giantswarm/cloudnative-pg-app
    version: 0.1.0
  exceptionRecommender:
    appName: exception-recommender
    chartName: exception-recommender
    catalog: giantswarm
    dependsOn:
      - kyverno-crds
    createNamespace: true
    enabled: false
    # namespace: security-bundle
    # used by renovate
    # repo: giantswarm/exception-recommender
    version: 0.3.0
  falco:
    appName: falco
    chartName: falco
    catalog: giantswarm
    dependsOn:
      - cilium
      - kyverno-crds
    createNamespace: true
    enabled: false
    # namespace: security-bundle
    # used by renovate
    # repo: giantswarm/falco-app
    version: 0.13.0
  jiralert:
    appName: jiralert
    chartName: jiralert
    catalog: giantswarm
    createNamespace: true
    enabled: false
    # namespace: security-bundle
    # used by renovate
    # repo: giantswarm/jiralert-app
    version: 0.1.4
  kubescape:
    appName: kubescape
    chartName: kubescape
    catalog: giantswarm-test
    dependsOn:
      - cilium
      - kyverno-crds
      - kyverno-policy-operator
    createNamespace: true
    enabled: false
    namespace: kubescape
    # kubescape does not finish installing within Flux's 5m default, so it
    # needs the same kind of override kyverno has.
    options:
      install:
        timeout: 15m
      upgrade:
        timeout: 15m
    # used by renovate
    # repo: giantswarm/kubescape-app
    version: 0.1.3-dev.main-update-chart.2026-09-10.22-52-42.h7730ed6
  kyverno:
    appName: kyverno
    chartName: kyverno
    catalog: giantswarm-test
    dependsOn:
      - cilium
      - kyverno-crds
      - prometheus-operator-crd
      - alloy-podlogs-crds
    enabled: true
    namespace: kyverno
    createNamespace: true
    # Options allow to configure timeouts:
    # https://docs.giantswarm.io/getting-started/app-platform/installation-configuration/
    options:
      install:
        timeout: 15m
      upgrade:
        timeout: 15m
    # used by renovate
    # repo: giantswarm/kyverno-app
    version: 0.24.3-dev.main-update-chart.2026-09-07.17-15-33.h2b66e25
  kyvernoCrds:
    appName: kyverno-crds
    chartName: kyverno-crds
    catalog: giantswarm-test
    enabled: true
    namespace: kyverno
    createNamespace: true
    # used by renovate
    # repo: giantswarm/kyverno-crds
    version: 1.17.1-dev.main-update-chart.2026-09-10.13-13-35.h07406cc
  kyvernoPolicyOperator:
    appName: kyverno-policy-operator
    chartName: kyverno-policy-operator
    catalog: giantswarm
    dependsOn:
      - cilium
      - kyverno-crds
      - kyverno
      - alloy-podlogs-crds
    enabled: true
    createNamespace: true
    # namespace: security-bundle
    # used by renovate
    # repo: giantswarm/kyverno-policy-operator
    version: 0.2.3
  # Kyverno policies for Kubernetes Pod Security Standards (PSS).
  # From: https://github.com/giantswarm/kyverno-policies/
  kyvernoPolicies:
    appName: kyverno-policies
    chartName: kyverno-policies
    catalog: giantswarm
    dependsOn:
      - kyverno-crds
    enabled: true
    namespace: kyverno
    createNamespace: true
    # used by renovate
    # repo: giantswarm/kyverno-policies
    version: 0.28.0
  policyApiCrds:
    appName: policy-api-crds
    chartName: policy-api-crds
    catalog: giantswarm
    dependsOn:
      - kyverno-policy-operator
    createNamespace: true
    enabled: false
    namespace: policy-system
    # used by renovate
    # repo: giantswarm/policy-api
    version: 0.0.12
  reportsServer:
    appName: reports-server
    chartName: reports-server
    catalog: giantswarm-operations-platform
    dependsOn:
      - cloudnative-pg
    createNamespace: true
    enabled: false
    namespace: kyverno
    # used by renovate
    # repo: giantswarm/reports-server-app
    version: 0.1.3
  starboardExporter:
    appName: starboard-exporter
    chartName: starboard-exporter
    catalog: giantswarm
    dependsOn:
      - prometheus-operator-crd
    createNamespace: true
    enabled: false
    namespace: security-bundle
    # used by renovate
    # repo: giantswarm/starboard-exporter
    version: 1.2.15
  trivy:
    appName: trivy
    chartName: trivy
    catalog: giantswarm
    dependsOn:
      - kyverno-crds
    createNamespace: true
    enabled: false
    # namespace: security-bundle
    # used by renovate
    # repo: giantswarm/trivy-app
    version: 0.18.0
  trivyOperator:
    appName: trivy-operator
    chartName: trivy-operator
    catalog: giantswarm
    dependsOn:
      - cilium
      - kyverno-crds
      - trivy
    createNamespace: true
    enabled: false
    # namespace: security-bundle
    # used by renovate
    # repo: giantswarm/trivy-operator-app
    version: 0.15.0
